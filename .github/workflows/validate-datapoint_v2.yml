name: Validate Datapoint (v2)
run-name: "[dataset] Validate PR #${{ inputs.pr_number }} (key=${{ inputs.run_key }})"

on:
  workflow_dispatch:
    inputs:
      organization:
        description: 'GitHub organization (dataset repo owner)'
        required: true
        type: string
        default: 'dpaia'
      repository:
        description: 'Dataset repository name'
        required: true
        type: string
        default: 'dataset'
      pr_number:
        description: 'Dataset PR number to validate'
        required: true
        type: string
      eval_type:
        description: 'Evaluation type (e.g., codegen, debugging)'
        required: true
        type: string
      run_key:
        description: 'Unique run correlation key (UUID)'
        required: false
        type: string
        default: 'manual'
      auto_merge:
        description: 'Whether to auto-merge the dataset PR if validation passes'
        required: false
        type: boolean
        default: false
      source_organization:
        description: 'Source PR owner organization (for Dataset Metadata lookup on failure)'
        required: false
        type: string
        default: ''
      source_repository:
        description: 'Source PR repository name'
        required: false
        type: string
        default: ''
      source_pr_number:
        description: 'Source PR number'
        required: false
        type: string
        default: ''
      dataset_project_number:
        description: 'Dataset Metadata project number (for status update on failure)'
        required: false
        type: string
        default: ''

jobs:
  # --- Find both artifact types among the PR's changed files ---
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_ee_bench: ${{ steps.detect.outputs.has_ee_bench }}
      instance_dir: ${{ steps.detect.outputs.instance_dir }}
      instance_id: ${{ steps.detect.outputs.instance_id }}
      has_harbor: ${{ steps.detect.outputs.has_harbor }}
      harbor_tasks: ${{ steps.detect.outputs.harbor_tasks }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v5

      - name: Check rate limit
        uses: ./.github/actions/check-rate-limit
        with:
          github_token: ${{ secrets.PROJECT_TOKEN }}

      - name: Checkout dataset PR
        uses: actions/checkout@v5
        with:
          repository: "${{ inputs.organization }}/${{ inputs.repository }}"
          token: ${{ secrets.PROJECT_TOKEN }}
          path: dataset-checkout
          ref: "refs/pull/${{ inputs.pr_number }}/head"

      - name: Detect changed artifacts
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          DATASET_REPO: "${{ inputs.organization }}/${{ inputs.repository }}"
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --repo "$DATASET_REPO" --name-only)

          # Walk up from a changed file to the closest dir containing a marker
          find_marker_dir() {
            local file="$1"
            local marker="$2"
            local dir
            dir="$(dirname "$file")"
            while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
              if [ -f "dataset-checkout/$dir/$marker" ]; then
                echo "$dir"
                return 0
              fi
              dir="$(dirname "$dir")"
            done
            return 1
          }

          EE_DIRS_FILE="${RUNNER_TEMP}/ee-instance-dirs.txt"
          HARBOR_DIRS_FILE="${RUNNER_TEMP}/harbor-task-dirs.txt"
          : > "$EE_DIRS_FILE"
          : > "$HARBOR_DIRS_FILE"

          while IFS= read -r changed_file; do
            [ -n "$changed_file" ] || continue
            find_marker_dir "$changed_file" "datapoint.json" >> "$EE_DIRS_FILE" || true
            find_marker_dir "$changed_file" "task.toml" >> "$HARBOR_DIRS_FILE" || true
          done <<< "$CHANGED_FILES"

          sort -u "$EE_DIRS_FILE" -o "$EE_DIRS_FILE"
          sort -u "$HARBOR_DIRS_FILE" -o "$HARBOR_DIRS_FILE"

          EE_COUNT=$(grep -c . "$EE_DIRS_FILE" || true)
          HARBOR_COUNT=$(grep -c . "$HARBOR_DIRS_FILE" || true)

          if [ "$EE_COUNT" -eq 0 ] && [ "$HARBOR_COUNT" -eq 0 ]; then
            echo "Error: no ee-bench instance directory (datapoint.json) or Harbor task directory (task.toml) found in PR changes" >&2
            exit 1
          fi

          INSTANCE_ID=""
          if [ "$EE_COUNT" -gt 0 ]; then
            # Use the first (should be only) instance directory
            INSTANCE_DIR=$(head -1 "$EE_DIRS_FILE")
            INSTANCE_ID=$(jq -r '.instance_id' "dataset-checkout/$INSTANCE_DIR/datapoint.json")
            echo "has_ee_bench=true" >> "$GITHUB_OUTPUT"
            echo "instance_dir=$INSTANCE_DIR" >> "$GITHUB_OUTPUT"
            echo "Detected ee-bench instance: $INSTANCE_ID at $INSTANCE_DIR"
          else
            echo "has_ee_bench=false" >> "$GITHUB_OUTPUT"
            echo "instance_dir=" >> "$GITHUB_OUTPUT"
          fi

          if [ "$HARBOR_COUNT" -gt 0 ]; then
            HARBOR_TASKS=$(jq -R -s -c 'split("\n") | map(select(length > 0))' "$HARBOR_DIRS_FILE")
            echo "has_harbor=true" >> "$GITHUB_OUTPUT"
            echo "harbor_tasks=$HARBOR_TASKS" >> "$GITHUB_OUTPUT"
            echo "Detected Harbor tasks: $HARBOR_TASKS"
            if [ -z "$INSTANCE_ID" ]; then
              FIRST_TASK=$(head -1 "$HARBOR_DIRS_FILE")
              INSTANCE_ID=$(grep -m1 -oP '^instance_id\s*=\s*"\K[^"]+' \
                "dataset-checkout/$FIRST_TASK/task.toml" || basename "$FIRST_TASK")
            fi
          else
            echo "has_harbor=false" >> "$GITHUB_OUTPUT"
            echo "harbor_tasks=[]" >> "$GITHUB_OUTPUT"
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

  # --- EE-Bench datapoint validation ---
  validate-ee-bench:
    needs: detect
    if: needs.detect.outputs.has_ee_bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v5

      - name: Checkout dataset PR
        uses: actions/checkout@v5
        with:
          repository: "${{ inputs.organization }}/${{ inputs.repository }}"
          token: ${{ secrets.PROJECT_TOKEN }}
          path: dataset-checkout
          ref: "refs/pull/${{ inputs.pr_number }}/head"

      - name: Run validation
        id: validate
        uses: ./.github/actions/run-validation
        with:
          instance_dir: dataset-checkout/${{ needs.detect.outputs.instance_dir }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          EE_BENCH_ARTIFACTS_DIR: ${{ runner.temp }}/eval-artifacts

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: "validation-${{ needs.detect.outputs.instance_id }}"
          path: ${{ steps.validate.outputs.log_path }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: "eval-artifacts-${{ needs.detect.outputs.instance_id }}"
          path: ${{ runner.temp }}/eval-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # --- Harbor task validation (one job per changed task dir) ---
  validate-harbor:
    needs: detect
    if: needs.detect.outputs.has_harbor == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task_path: ${{ fromJSON(needs.detect.outputs.harbor_tasks) }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v5

      - name: Checkout dataset PR
        uses: actions/checkout@v5
        with:
          repository: "${{ inputs.organization }}/${{ inputs.repository }}"
          token: ${{ secrets.PROJECT_TOKEN }}
          path: dataset-checkout
          ref: "refs/pull/${{ inputs.pr_number }}/head"

      - name: Run Harbor validation
        id: harbor
        uses: ./.github/actions/run-harbor-validation
        with:
          task_dir: dataset-checkout/${{ matrix.task_path }}
          min_reward: '1'

      - name: Upload Harbor validation log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: "harbor-validation-${{ inputs.run_key }}-${{ strategy.job-index }}"
          path: ${{ steps.harbor.outputs.log_path }}
          if-no-files-found: warn
          retention-days: 7

  # --- Combined result, auto-merge, comments, project status ---
  finalize:
    needs: [detect, validate-ee-bench, validate-harbor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v5

      - name: Compute validation result
        id: result
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          EE_RESULT: ${{ needs.validate-ee-bench.result }}
          HARBOR_RESULT: ${{ needs.validate-harbor.result }}
        run: |
          OVERALL=success
          if [ "$DETECT_RESULT" != "success" ]; then
            OVERALL=failure
          fi
          if [ "$EE_RESULT" != "success" ] && [ "$EE_RESULT" != "skipped" ]; then
            OVERALL=failure
          fi
          if [ "$HARBOR_RESULT" != "success" ] && [ "$HARBOR_RESULT" != "skipped" ]; then
            OVERALL=failure
          fi
          echo "result=$OVERALL" >> "$GITHUB_OUTPUT"
          echo "Overall validation result: $OVERALL (detect=$DETECT_RESULT, ee-bench=$EE_RESULT, harbor=$HARBOR_RESULT)"

      # --- Auto-merge on validation success ---
      - name: Auto-merge dataset PR
        id: automerge
        if: steps.result.outputs.result == 'success' && inputs.auto_merge == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          DATASET_REPO: "${{ inputs.organization }}/${{ inputs.repository }}"
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set_output() {
            local name="$1"
            local value="$2"
            {
              echo "$name<<AUTOMERGE_OUTPUT_EOF"
              echo "$value"
              echo "AUTOMERGE_OUTPUT_EOF"
            } >> "$GITHUB_OUTPUT"
          }

          wait_for_mergeable() {
            local max_retries=5
            local retry=0
            local mergeable=""

            while [ "$retry" -lt "$max_retries" ]; do
              mergeable=$(gh pr view "$PR_NUMBER" --repo "$DATASET_REPO" --json mergeable --jq '.mergeable' 2>/dev/null || echo "UNKNOWN")
              if [ "$mergeable" = "MERGEABLE" ] || [ "$mergeable" = "CONFLICTING" ]; then
                echo "$mergeable"
                return 0
              fi
              retry=$((retry + 1))
              echo "Mergeability is '$mergeable', retrying ($retry/$max_retries)..." >&2
              sleep $((retry * 3))
            done

            echo "$mergeable"
          }

          MAX_MERGE_ATTEMPTS=5
          for ATTEMPT in $(seq 1 "$MAX_MERGE_ATTEMPTS"); do
            echo "Auto-merge attempt $ATTEMPT/$MAX_MERGE_ATTEMPTS..."
            MERGEABLE=$(wait_for_mergeable)

            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              DETAILS="PR #$PR_NUMBER has merge conflicts; manual intervention required."
              echo "::error::$DETAILS"
              set_output "status" "merge-conflict"
              set_output "details" "$DETAILS"
              exit 1
            fi

            if [ "$MERGEABLE" != "MERGEABLE" ]; then
              DETAILS="PR #$PR_NUMBER mergeability is '$MERGEABLE' after retries; deferring to sweep."
              echo "::warning::$DETAILS"
              set_output "status" "deferred"
              set_output "details" "$DETAILS"
              exit 0
            fi

            if MERGE_OUTPUT=$(gh pr merge "$PR_NUMBER" --repo "$DATASET_REPO" --squash --delete-branch 2>&1); then
              echo "$MERGE_OUTPUT"
              set_output "status" "merged"
              set_output "details" "Successfully merged and cleaned up PR #$PR_NUMBER."
              exit 0
            fi

            echo "$MERGE_OUTPUT"
            if echo "$MERGE_OUTPUT" | grep -qi "Base branch was modified" && [ "$ATTEMPT" -lt "$MAX_MERGE_ATTEMPTS" ]; then
              echo "Base branch changed during merge; retrying after GitHub recomputes mergeability..."
              sleep $((ATTEMPT * 5))
              continue
            fi

            DETAILS="$MERGE_OUTPUT"
            set_output "status" "failed"
            set_output "details" "$DETAILS"
            echo "::error::Auto-merge failed for PR #$PR_NUMBER"
            exit 1
          done

      - name: Comment on dataset PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          RESULT: ${{ steps.result.outputs.result }}
          INSTANCE_ID: ${{ needs.detect.outputs.instance_id }}
          EE_JOB_RESULT: ${{ needs.validate-ee-bench.result }}
          HARBOR_JOB_RESULT: ${{ needs.validate-harbor.result }}
          HARBOR_TASKS: ${{ needs.detect.outputs.harbor_tasks }}
          AUTO_MERGE_REQUESTED: ${{ inputs.auto_merge }}
          AUTO_MERGE_OUTCOME: ${{ steps.automerge.outcome }}
          AUTO_MERGE_STATUS: ${{ steps.automerge.outputs.status }}
          AUTO_MERGE_DETAILS: ${{ steps.automerge.outputs.details }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then
            if [ "$AUTO_MERGE_REQUESTED" != "true" ]; then
              ICON="✅"
              MSG="Datapoint validation **passed**. Auto-merge was not requested."
            elif [ "$AUTO_MERGE_STATUS" = "merged" ]; then
              ICON="✅"
              MSG="Datapoint validation **passed** and auto-merge completed."
            elif [ "$AUTO_MERGE_STATUS" = "deferred" ]; then
              ICON="✅"
              MSG="Datapoint validation **passed**; auto-merge was deferred."
            elif [ "$AUTO_MERGE_OUTCOME" = "failure" ]; then
              ICON="⚠️"
              MSG="Datapoint validation **passed**, but auto-merge **failed**."
            else
              ICON="✅"
              MSG="Datapoint validation **passed**."
            fi
          else
            ICON="❌"
            MSG="Datapoint validation **failed**."
          fi

          COMMENT_BODY="${ICON} ${MSG}

          **Instance:** \`${INSTANCE_ID}\`"

          if [ "$EE_JOB_RESULT" != "skipped" ]; then
            COMMENT_BODY="${COMMENT_BODY}
          **EE-Bench validation:** ${EE_JOB_RESULT}"
          fi

          if [ "$HARBOR_JOB_RESULT" != "skipped" ] && [ -n "$HARBOR_TASKS" ] && [ "$HARBOR_TASKS" != "[]" ]; then
            TASK_LIST=$(echo "$HARBOR_TASKS" | jq -r 'map("`" + . + "`") | join(", ")')
            COMMENT_BODY="${COMMENT_BODY}
          **Harbor validation:** ${HARBOR_JOB_RESULT} (${TASK_LIST})"
          fi

          if [ -n "$AUTO_MERGE_DETAILS" ]; then
            COMMENT_BODY="${COMMENT_BODY}
          **Auto-merge:** ${AUTO_MERGE_DETAILS}"
          fi

          COMMENT_BODY="${COMMENT_BODY}
          **Details:** [Workflow run](${RUN_URL})"

          gh pr comment "${{ inputs.pr_number }}" \
            --repo "${{ inputs.organization }}/${{ inputs.repository }}" \
            --body "$COMMENT_BODY" || true

      # --- Dataset Metadata: set Status=Invalid on validation failure ---
      - name: Find source PR in Dataset Metadata project
        id: find-source-pr
        if: always() && steps.result.outputs.result != 'success' && inputs.dataset_project_number != '' && inputs.source_pr_number != ''
        uses: ./.github/actions/find-pr-in-project
        with:
          organization: ${{ inputs.source_organization }}
          repository: ${{ inputs.source_repository }}
          pr_number: ${{ inputs.source_pr_number }}
          project_number: ${{ inputs.dataset_project_number }}
          github_token: ${{ secrets.PROJECT_TOKEN }}

      - name: Set Dataset Metadata Status to Invalid
        if: always() && steps.result.outputs.result != 'success' && inputs.dataset_project_number != '' && steps.find-source-pr.outputs.item_id != ''
        uses: ./.github/actions/set-project-status
        with:
          organization: ${{ inputs.source_organization }}
          project_number: ${{ inputs.dataset_project_number }}
          item_id: ${{ steps.find-source-pr.outputs.item_id }}
          value: Invalid
          github_token: ${{ secrets.PROJECT_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "# Datapoint Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dataset PR:** ${{ inputs.organization }}/${{ inputs.repository }}#${{ inputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance:** ${{ needs.detect.outputs.instance_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Eval type:** ${{ inputs.eval_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **EE-Bench validation:** ${{ needs.validate-ee-bench.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Harbor validation:** ${{ needs.validate-harbor.result }} (tasks: ${{ needs.detect.outputs.harbor_tasks }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Result:** ${{ steps.result.outputs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-merge requested:** ${{ inputs.auto_merge }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-merge status:** ${{ steps.automerge.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run key:** ${{ inputs.run_key }}" >> $GITHUB_STEP_SUMMARY
